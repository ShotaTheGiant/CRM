<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared CRM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Shared CRM</h1>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncText">Connecting…</span></div>
  <div style="display:flex;gap:8px">
    <button class="btn" id="importBtn" title="Import contacts from a CSV file">Import CSV</button>
    <button class="btn" id="copyCsv" title="Copy all contacts as CSV">Copy CSV</button>
    <button class="btn primary" id="newBtn">+ New contact</button>
  </div>
</header>
<main>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-v="board">Board</button>
      <button class="tab" data-v="list">List</button>
      <button class="tab" data-v="tasks">Follow-ups</button>
    </div>
    <input type="search" id="q" placeholder="Search name, company, email…">
    <select id="who"></select>
  </div>
  <div id="view"></div>
</main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
const STAGES=["Lead","Contacted","Meeting","Proposal","Won","Lost"];
const CLOSED=["Won","Lost"];
const S={contacts:[],people:[],names:{},me:null,view:"board",q:"",who:"all",loaded:false};
let db=null,user=null,online=false,modalId=undefined;
const LS="shared-crm-contacts-v1";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const money=n=>new Intl.NumberFormat(undefined,{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(+n||0);
const fmtDate=d=>{if(!d)return"";const [y,m,dd]=d.split("-");return new Date(+y,+m-1,+dd).toLocaleDateString(undefined,{day:"numeric",month:"short"});};
const fmtTs=t=>new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const isOpen=c=>!CLOSED.includes(c.stage);
const who=id=>!id?"Unassigned":id===S.me?"Me":(S.names[id]||"Partner");
const initial=id=>!id?"–":who(id).trim().charAt(0).toUpperCase();
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toastRoot").appendChild(t);setTimeout(()=>t.remove(),3000);}

/* ---------- storage layer (shared db, or local fallback) ---------- */
const queues={};
function enqueue(id,fn){
  queues[id]=(queues[id]||Promise.resolve()).then(fn).catch(e=>{
    console.error(e);
    toast(e&&e.code==="invalid_argument"?"You need Contributor access to edit this CRM.":"Could not save – try again.");
  });
}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S.contacts));}catch(e){}}
function saveContact(id,data,isNew){
  const now=Date.now();
  if(!db){
    const i=S.contacts.findIndex(c=>c.id===id);
    if(i<0)S.contacts.push({id,...data,updatedAt:now});else S.contacts[i]={...S.contacts[i],...data,updatedAt:now};
    persistLocal();render();return;
  }
  enqueue(id,()=>isNew?db.doc("contacts/"+id).set({...data,updatedAt:now}):db.doc("contacts/"+id).update({...data,updatedAt:now}));
}
function deleteContact(id){
  if(!db){S.contacts=S.contacts.filter(c=>c.id!==id);persistLocal();render();return;}
  enqueue(id,()=>db.doc("contacts/"+id).delete());
}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function init(){
  render();
  try{
    if(typeof claude!=="undefined"){
      user=await claude.use("user");
      db=await claude.use("db");
    }
  }catch(e){db=null;}
  if(user&&user.id){try{S.me=await user.id();}catch(e){}}
  if(!db){
    try{S.contacts=JSON.parse(localStorage.getItem(LS)||"[]");}catch(e){S.contacts=[];}
    S.loaded=true;setSync("local");render();return;
  }
  let timer=setTimeout(()=>setSync("slow"),10000);
  db.collection("contacts").onSnapshot(snap=>{
    S.contacts=snap.docs.map(d=>({id:d.id,...d.data()}));
    S.loaded=true;
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync("on");}
    render();refreshModalNotes();
  },err=>{clearTimeout(timer);setSync("err");});
  db.collection("people").onSnapshot(snap=>{
    S.people=snap.docs.map(d=>d.id);
    resolveNames();
  },()=>{});
  if(S.me){
    try{const r=await db.doc("people/"+S.me).get();if(!r.exists)await db.doc("people/"+S.me).set({joined:Date.now()});}catch(e){}
  }
  if(user&&user.can&&user.can("data.write")===false){
    $("#banner").innerHTML='<div class="banner">You have view-only access. Ask the owner to share this page with you as a <b>Contributor</b> so you can edit.</div>';
  }
}
async function resolveNames(){
  try{
    if(user&&user.profiles&&S.people.length){
      const ps=await user.profiles(S.people);
      S.people.forEach(id=>{S.names[id]=(ps[id]&&ps[id].name)||"";});
    }
  }catch(e){}
  fillWho();render();
}
function setSync(state){
  const dot=$("#dot"),t=$("#syncText");
  dot.className="dot";
  if(state==="on"){dot.classList.add("on");t.textContent="Shared & live";}
  else if(state==="slow"){dot.classList.add("warn");t.textContent="Can't reach shared data yet…";}
  else if(state==="err"){dot.classList.add("warn");t.textContent="Sync error";}
  else if(state==="local"){dot.classList.add("warn");t.textContent="Local only (not shared)";
    $("#banner").innerHTML='<div class="banner">Shared storage isn\'t available here, so data is saved only in this browser. Open the published link to share with your partner.</div>';}
}

/* ---------- filtering ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.contacts.filter(c=>{
    if(S.who==="me"&&c.assignee!==S.me)return false;
    if(S.who==="none"&&c.assignee)return false;
    if(S.who!=="all"&&S.who!=="me"&&S.who!=="none"&&c.assignee!==S.who)return false;
    if(!q)return true;
    return [c.name,c.company,c.email,c.phone,c.nextStep,c.source].some(v=>(v||"").toLowerCase().includes(q));
  });
}
function fillWho(){
  const sel=$("#who"),cur=S.who;
  let h='<option value="all">Everyone</option><option value="me">Mine</option>';
  S.people.filter(id=>id!==S.me).forEach(id=>{h+='<option value="'+esc(id)+'">'+esc(who(id))+"</option>";});
  h+='<option value="none">Unassigned</option>';
  sel.innerHTML=h;sel.value=cur;
}

/* ---------- rendering ---------- */
function dueChip(c){
  if(!c.nextDate||!isOpen(c))return"";
  const t=todayStr();
  const cls=c.nextDate<t?"late":c.nextDate===t?"today":"";
  return '<span class="chip '+cls+'">'+(c.nextDate<t?"Overdue · ":c.nextDate===t?"Today · ":"")+esc(fmtDate(c.nextDate))+"</span>";
}
function renderStats(){
  const t=todayStr(),open=S.contacts.filter(isOpen);
  const pipe=open.reduce((s,c)=>s+(+c.value||0),0);
  const won=S.contacts.filter(c=>c.stage==="Won").reduce((s,c)=>s+(+c.value||0),0);
  const late=open.filter(c=>c.nextDate&&c.nextDate<t).length;
  const wonN=S.contacts.filter(c=>c.stage==="Won").length,lostN=S.contacts.filter(c=>c.stage==="Lost").length;
  const rate=wonN+lostN?Math.round(wonN/(wonN+lostN)*100)+"%":"–";
  $("#stats").innerHTML=
    '<div class="stat"><b>'+open.length+'</b><span>Open contacts</span></div>'+
    '<div class="stat"><b>'+money(pipe)+'</b><span>Open pipeline</span></div>'+
    '<div class="stat"><b>'+money(won)+'</b><span>Won</span></div>'+
    '<div class="stat"><b>'+rate+'</b><span>Win rate</span></div>'+
    '<div class="stat '+(late?"bad":"")+'"><b>'+late+'</b><span>Overdue follow-ups</span></div>';
}
function renderBoard(list){
  let h='<div class="board">';
  STAGES.forEach((st,si)=>{
    const items=list.filter(c=>(c.stage||"Lead")===st);
    const sum=items.reduce((s,c)=>s+(+c.value||0),0);
    h+='<div class="col" data-stage="'+st+'"><h3><span>'+st+" · "+items.length+"</span><span>"+(sum?money(sum):"")+"</span></h3>";
    items.sort((a,b)=>(a.nextDate||"9999").localeCompare(b.nextDate||"9999")).forEach(c=>{
      h+='<div class="card" draggable="true" data-id="'+esc(c.id)+'">'+
        '<div class="n">'+esc(c.name||"(no name)")+"</div>"+
        '<div class="c">'+esc(c.company||"")+(c.value?(c.company?" · ":"")+money(c.value):"")+"</div>"+
        '<div class="row"><span>'+dueChip(c)+'</span><span style="display:flex;gap:6px;align-items:center">'+
        '<span class="mv">'+(si>0?'<button data-mv="-1" title="Move back">◀</button>':"")+(si<STAGES.length-1?'<button data-mv="1" title="Move forward">▶</button>':"")+"</span>"+
        '<span class="chip" title="'+esc(who(c.assignee))+'">'+esc(initial(c.assignee))+"</span></span></div></div>";
    });
    h+="</div>";
  });
  h+="</div>";
  return h;
}
function renderList(list){
  if(!list.length)return '<div class="empty">No contacts match.</div>';
  const rows=list.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(c=>
    '<tr class="click" data-id="'+esc(c.id)+'"><td><b>'+esc(c.name)+'</b><div class="sub" style="color:var(--muted);font-size:12px">'+esc(c.email||c.phone||"")+"</div></td>"+
    "<td>"+esc(c.company||"")+"</td><td><span class='chip'>"+esc(c.stage||"Lead")+"</span></td><td>"+(c.value?money(c.value):"")+"</td>"+
    "<td>"+esc(who(c.assignee))+"</td><td>"+esc(c.nextStep||"")+" "+dueChip(c)+"</td></tr>").join("");
  return '<div class="tablewrap"><table><thead><tr><th>Name</th><th>Company</th><th>Stage</th><th>Value</th><th>Owner</th><th>Next step</th></tr></thead><tbody>'+rows+"</tbody></table></div>";
}
function renderTasks(list){
  const t=todayStr(),open=list.filter(isOpen);
  const groups=[["Overdue",open.filter(c=>c.nextDate&&c.nextDate<t)],["Today",open.filter(c=>c.nextDate===t)],
    ["Upcoming",open.filter(c=>c.nextDate&&c.nextDate>t)],["No date set",open.filter(c=>!c.nextDate)]];
  let h="";
  groups.forEach(([title,items])=>{
    if(!items.length)return;
    items.sort((a,b)=>(a.nextDate||"").localeCompare(b.nextDate||""));
    h+='<div class="group"><h3>'+title+" ("+items.length+")</h3>"+items.map(c=>
      '<div class="item" data-id="'+esc(c.id)+'"><div class="grow"><b>'+esc(c.name)+"</b> "+(c.company?'<span class="sub">· '+esc(c.company)+"</span>":"")+
      '<div class="sub">'+esc(c.nextStep||"No next step set")+"</div></div>"+dueChip(c)+'<span class="chip">'+esc(who(c.assignee))+"</span></div>").join("")+"</div>";
  });
  return h||'<div class="empty">Nothing to follow up on. Add a next step and date to a contact.</div>';
}
function render(){
  renderStats();
  const list=filtered();
  const v=$("#view");
  if(!S.loaded){v.innerHTML='<div class="empty">Loading…</div>';return;}
  if(!S.contacts.length){v.innerHTML='<div class="empty">No contacts yet. Click <b>+ New contact</b> to add your first lead.</div>';return;}
  v.innerHTML=S.view==="board"?renderBoard(list):S.view==="list"?renderList(list):renderTasks(list);
}

/* ---------- events ---------- */
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;
  S.view=b.dataset.v;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===b));render();
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;render();});
$("#who").addEventListener("change",e=>{S.who=e.target.value;render();});
$("#newBtn").addEventListener("click",()=>openModal(null));
$("#copyCsv").addEventListener("click",async()=>{
  const cols=["name","company","email","phone","source","stage","value","assignee","nextStep","nextDate"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv=[cols.join(",")].concat(S.contacts.map(c=>cols.map(k=>q(k==="assignee"?who(c.assignee):c[k])).join(","))).join("\n");
  try{await navigator.clipboard.writeText(csv);toast("CSV copied to clipboard");}catch(e){toast("Copy not allowed here.");}
});
const viewEl=$("#view");
viewEl.addEventListener("click",e=>{
  const mv=e.target.closest("[data-mv]");
  const el=e.target.closest("[data-id]");
  if(!el)return;
  const c=S.contacts.find(x=>x.id===el.dataset.id);if(!c)return;
  if(mv){
    e.stopPropagation();
    const i=STAGES.indexOf(c.stage||"Lead")+(+mv.dataset.mv);
    if(i>=0&&i<STAGES.length)saveContact(c.id,{stage:STAGES[i]});
    return;
  }
  openModal(c.id);
});
let dragId=null;
viewEl.addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragId=c.dataset.id;try{e.dataTransfer.setData("text/plain",dragId);}catch(_){}});
viewEl.addEventListener("dragover",e=>{const col=e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();col.classList.add("over");});
viewEl.addEventListener("dragleave",e=>{const col=e.target.closest(".col");if(col)col.classList.remove("over");});
viewEl.addEventListener("drop",e=>{
  const col=e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();
  document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over"));
  const c=S.contacts.find(x=>x.id===dragId);
  if(c&&(c.stage||"Lead")!==col.dataset.stage)saveContact(c.id,{stage:col.dataset.stage});
  dragId=null;
});
viewEl.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over"));});

/* ---------- modal ---------- */
function notesHtml(c){
  const notes=(c&&c.notes)||[];
  if(!notes.length)return '<div style="color:var(--muted);font-size:12px">No notes yet.</div>';
  return notes.slice().reverse().map(n=>'<div class="note"><small>'+esc(fmtTs(n.at))+" · "+esc(who(n.by))+"</small><div>"+esc(n.t).replace(/\n/g,"<br>")+"</div></div>").join("");
}
function refreshModalNotes(){
  if(modalId===undefined||modalId===null)return;
  const box=document.getElementById("notesBox");if(!box)return;
  const c=S.contacts.find(x=>x.id===modalId);if(c)box.innerHTML=notesHtml(c);
}
function openModal(id){
  modalId=id;
  const c=id?S.contacts.find(x=>x.id===id):null;
  const people=[...new Set([S.me,...S.people].filter(Boolean))];
  const f=(k,d)=>esc(c&&c[k]!=null?c[k]:d);
  $("#modalRoot").innerHTML=
  '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true"><h2>'+(c?"Edit contact":"New contact")+"</h2>"+
  '<div class="grid">'+
  '<div><label>Name *</label><input type="text" id="f_name" value="'+f("name","")+'"></div>'+
  '<div><label>Company</label><input type="text" id="f_company" value="'+f("company","")+'"></div>'+
  '<div><label>Email</label><input type="email" id="f_email" value="'+f("email","")+'"></div>'+
  '<div><label>Phone</label><input type="tel" id="f_phone" value="'+f("phone","")+'"></div>'+
  '<div><label>Stage</label><select id="f_stage">'+STAGES.map(s=>'<option'+(((c&&c.stage)||"Lead")===s?" selected":"")+">"+s+"</option>").join("")+"</select></div>"+
  '<div><label>Deal value (EUR)</label><input type="number" id="f_value" min="0" step="any" value="'+f("value","")+'"></div>'+
  '<div><label>Owner</label><select id="f_assignee"><option value="">Unassigned</option>'+people.map(p=>'<option value="'+esc(p)+'"'+((c?c.assignee:S.me)===p?" selected":"")+">"+esc(who(p))+"</option>").join("")+"</select></div>"+
  '<div><label>Source</label><input type="text" id="f_source" placeholder="Referral, website, event…" value="'+f("source","")+'"></div>'+
  '<div><label>Next step</label><input type="text" id="f_next" placeholder="Send proposal, call back…" value="'+f("nextStep","")+'"></div>'+
  '<div><label>Follow-up date</label><input type="date" id="f_date" value="'+f("nextDate","")+'"></div>'+
  '<div class="full"><label>Notes</label><div class="notes" id="notesBox">'+notesHtml(c)+'</div><textarea id="f_note" rows="2" placeholder="Add a note (call summary, details…)"></textarea></div>'+
  "</div>"+
  '<div class="actions"><button class="btn primary" id="saveBtn">Save</button><button class="btn" id="cancelBtn">Cancel</button><span class="spacer"></span>'+
  (c?'<button class="btn danger" id="delBtn">Delete</button>':"")+"</div></div></div>";
  $("#f_name").focus();
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal();});
  $("#cancelBtn").onclick=closeModal;
  $("#saveBtn").onclick=()=>{
    const name=$("#f_name").value.trim();
    if(!name){toast("Please enter a name.");$("#f_name").focus();return;}
    const data={
      name,company:$("#f_company").value.trim(),email:$("#f_email").value.trim(),phone:$("#f_phone").value.trim(),
      stage:$("#f_stage").value,value:+$("#f_value").value||0,assignee:$("#f_assignee").value,source:$("#f_source").value.trim(),
      nextStep:$("#f_next").value.trim(),nextDate:$("#f_date").value
    };
    const note=$("#f_note").value.trim();
    const notes=((c&&c.notes)||[]).slice();
    if(note)notes.push({t:note,by:S.me||"",at:Date.now()});
    data.notes=notes;
    if(c)saveContact(c.id,data,false);
    else saveContact(newId(),{...data,createdAt:Date.now(),createdBy:S.me||""},true);
    closeModal();
  };
  if(c){
    let armed=false;
    $("#delBtn").onclick=function(){
      if(!armed){armed=true;this.textContent="Click again to confirm";return;}
      deleteContact(c.id);closeModal();
    };
  }
}
function closeModal(){modalId=undefined;$("#modalRoot").innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modalId!==undefined)closeModal();});

/* ---------- CSV import ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const counts={",":0,";":0,"\t":0};
  let inq=false;
  for(const ch of first){if(ch==='"')inq=!inq;else if(!inq&&counts[ch]!==undefined)counts[ch]++;}
  const delim=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}
      else cell+=ch;
    }else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&text[i+1]==="\n")i++;
      row.push(cell);cell="";
      if(row.some(x=>x.trim()!==""))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  row.push(cell);
  if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows;
}
const SYN={
  name:["name","fullname","contact","contactname","person"],
  first:["firstname","first","givenname"],
  last:["lastname","last","surname","familyname"],
  company:["company","organization","organisation","account","business","companyname"],
  email:["email","emailaddress","mail","email1"],
  phone:["phone","mobile","tel","telephone","phonenumber","cell"],
  source:["source","leadsource","origin","channel"],
  stage:["stage","status","pipelinestage","dealstage"],
  value:["value","dealvalue","amount","deal","revenue","price"],
  nextStep:["nextstep","next","nextaction","action"],
  nextDate:["nextdate","followupdate","followup","duedate","due","date"],
  notes:["notes","note","comments","comment","description"]
};
function mapRows(rows){
  if(rows.length<2)return {error:"The file needs a header row and at least one data row."};
  const norm=h=>h.toLowerCase().replace(/[^a-z0-9]/g,"");
  const heads=rows[0].map(norm);
  const idx={};
  Object.keys(SYN).forEach(k=>{
    for(const syn of SYN[k]){const i=heads.indexOf(syn);if(i>=0){idx[k]=i;break;}}
  });
  if(idx.name===undefined&&idx.first===undefined&&idx.email===undefined&&idx.company===undefined)
    return {error:"Couldn't find a Name, Email or Company column. Check the header row."};
  const get=(r,k)=>idx[k]===undefined?"":(r[idx[k]]||"").trim();
  const parseVal=v=>{
    v=v.replace(/[^\d.,-]/g,"");if(!v)return 0;
    if(v.includes(",")&&v.includes(".")){
      if(v.lastIndexOf(",")>v.lastIndexOf("."))v=v.replace(/\./g,"").replace(",",".");
      else v=v.replace(/,/g,"");
    }else if(v.includes(",")){v=/,\d{1,2}$/.test(v)?v.replace(",","."):v.replace(/,/g,"");}
    else if((v.match(/\./g)||[]).length>1)v=v.replace(/\./g,"");
    return +v||0;
  };
  const parseDate=d=>{
    d=d.trim();if(!d)return"";
    let m=d.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
    if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
    m=d.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
    if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
    return"";
  };
  const have=new Set(S.contacts.map(c=>(c.email||"").toLowerCase()).filter(Boolean));
  const out=[];let skippedDup=0,skippedEmpty=0;
  rows.slice(1).forEach(r=>{
    let name=get(r,"name");
    if(!name)name=(get(r,"first")+" "+get(r,"last")).trim();
    const email=get(r,"email"),company=get(r,"company");
    if(!name)name=email||company;
    if(!name){skippedEmpty++;return;}
    if(email&&have.has(email.toLowerCase())){skippedDup++;return;}
    if(email)have.add(email.toLowerCase());
    const st=get(r,"stage").toLowerCase();
    const stage=STAGES.find(x=>x.toLowerCase()===st)||"Lead";
    const note=get(r,"notes");
    out.push({
      name,company,email,phone:get(r,"phone"),source:get(r,"source"),stage,
      value:parseVal(get(r,"value")),assignee:S.me||"",
      nextStep:get(r,"nextStep"),nextDate:parseDate(get(r,"nextDate")),
      notes:note?[{t:note,by:S.me||"",at:Date.now()}]:[],
      createdAt:Date.now(),createdBy:S.me||""
    });
  });
  return {rows:out,skippedDup,skippedEmpty,found:Object.keys(idx)};
}
function openImport(){
  modalId=null;
  $("#modalRoot").innerHTML=
  '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true"><h2>Import contacts from CSV</h2>'+
  '<label>Choose a CSV file</label><input type="file" id="csvFile" accept=".csv,text/csv,text/plain">'+
  '<div class="hint">…or paste the CSV text below. Columns recognised: Name (or First/Last name), Company, Email, Phone, Source, Stage, Value, Next step, Follow-up date, Notes. Comma, semicolon and tab separators all work. Contacts with an email that already exists are skipped.</div>'+
  '<textarea id="csvText" rows="6" placeholder="Name,Company,Email,Phone,Stage,Value&#10;Jane Doe,Acme,jane@acme.com,+359 888 000 000,Lead,2500"></textarea>'+
  '<div id="csvPrev"></div>'+
  '<div class="actions"><button class="btn primary" id="csvGo" disabled>Import</button><button class="btn" id="csvCancel">Cancel</button><span class="spacer"></span><button class="btn sm" id="csvTpl">Copy template header</button></div></div></div>';
  let parsed=null;
  const prev=$("#csvPrev"),go=$("#csvGo");
  function analyse(text){
    parsed=null;go.disabled=true;
    if(!text.trim()){prev.innerHTML="";return;}
    let res;
    try{res=mapRows(parseCSV(text));}catch(e){res={error:"Couldn't read that file as CSV."};}
    if(res.error){prev.innerHTML='<div class="prev bad">'+esc(res.error)+"</div>";return;}
    parsed=res.rows;
    let h='<div class="prev"><b>'+res.rows.length+"</b> contact"+(res.rows.length===1?"":"s")+" ready to import";
    if(res.skippedDup)h+=" · "+res.skippedDup+" duplicate (same email) skipped";
    if(res.skippedEmpty)h+=" · "+res.skippedEmpty+" empty row"+(res.skippedEmpty===1?"":"s")+" skipped";
    if(res.rows.length){
      h+='<table class="mini"><tr><th>Name</th><th>Company</th><th>Email</th><th>Stage</th><th>Value</th></tr>'+
        res.rows.slice(0,5).map(r=>"<tr><td>"+esc(r.name)+"</td><td>"+esc(r.company)+"</td><td>"+esc(r.email)+"</td><td>"+esc(r.stage)+"</td><td>"+(r.value||"")+"</td></tr>").join("")+"</table>";
      if(res.rows.length>5)h+='<div class="hint">…and '+(res.rows.length-5)+" more.</div>";
    }
    prev.innerHTML=h+"</div>";
    go.disabled=!res.rows.length;
  }
  $("#csvFile").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{$("#csvText").value=String(rd.result||"");analyse($("#csvText").value);};
    rd.onerror=()=>{prev.innerHTML='<div class="prev bad">Couldn\'t read that file.</div>';};
    rd.readAsText(f);
  });
  $("#csvText").addEventListener("input",e=>analyse(e.target.value));
  $("#csvCancel").onclick=closeModal;
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal();});
  $("#csvTpl").onclick=async()=>{
    try{await navigator.clipboard.writeText("Name,Company,Email,Phone,Source,Stage,Value,Next step,Follow-up date,Notes");toast("Template header copied");}
    catch(e){toast("Copy not allowed here.");}
  };
  go.onclick=async()=>{
    if(!parsed||!parsed.length)return;
    go.disabled=true;go.textContent="Importing…";
    const rows=parsed;let ok=0,fail=0;
    if(!db){
      rows.forEach(r=>{S.contacts.push({id:newId(),...r,updatedAt:Date.now()});ok++;});
      persistLocal();render();
    }else{
      for(const r of rows){
        try{await db.doc("contacts/"+newId()).set({...r,updatedAt:Date.now()});ok++;}
        catch(e){fail++;if(e&&(e.code==="quota_exceeded"||e.code==="invalid_argument"))break;}
      }
    }
    closeModal();
    toast(fail?("Imported "+ok+", "+(rows.length-ok)+" failed (check your access)."):("Imported "+ok+" contact"+(ok===1?"":"s")+"."));
  };
}
$("#importBtn").addEventListener("click",openImport);

fillWho();
init();
})();
</script>
